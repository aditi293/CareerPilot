<div class="dashboard-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        Welcome, {{ userName }}! 👋
      </mat-card-title>
      <mat-card-subtitle>
        What would you like to do today?
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="menu-grid">
       <button mat-raised-button
        color="primary"
        (click)="goToResume()">
        📄 Analyse Resume
        </button>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button mat-stroked-button
              color="warn"
              (click)="logout()">
        Logout
      </button>
    </mat-card-actions>
  </mat-card>
</div>
